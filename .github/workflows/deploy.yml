# Deploy: build Docker images → push to Artifact Registry → gcloud run deploy.
#
# Copy to <app-repo>/.github/workflows/deploy.yml and replace every `SET:` line.
#
# GitHub repo secrets required (Settings → Secrets → Actions):
#   GCP_PROJECT_ID   e.g. my-project-123456
#   GCP_REGION       e.g. asia-southeast1  (must match terraform gcp_region)
#   GCP_SA_KEY       JSON key of the deployer service account (see README §3)
#
# Runner facts that shaped this file (measured, don't re-add what was removed):
#   - gcloud is preinstalled on ubuntu-latest → no setup-gcloud step.
#   - docker/login-action replaces `gcloud auth configure-docker` (saves ~17s).
#   - provenance: false → skips attestation manifests Cloud Run doesn't use.
#   - GHA cache with per-app scope: warm builds ~20-30% faster.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # manual run deploys BOTH apps regardless of path filter

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  GCP_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION }}
  # SET: last path segment = Artifact Registry repository_id from terraform (var.app_name)
  REGISTRY: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/APP_NAME

jobs:
  # ── Only rebuild what changed ──────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # SET: paths per app. Shared packages go in BOTH lists.
          # Single-package repo (no monorepo): delete this job and the `needs`/`if` lines below.
          filters: |
            backend:
              - 'apps/backend/**'
              - 'packages/**'
            frontend:
              - 'apps/frontend/**'
              - 'packages/**'

  # ── Backend ────────────────────────────────────────────────────────────────
  deploy-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.GCP_REGION }}-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: . # repo root: monorepo Dockerfiles need sibling package.json files
          file: apps/backend/Dockerfile # SET
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Deploy to Cloud Run
        # SET: service name = terraform output cloud_run_backend_service_name.
        # Runtime env vars live in terraform (main.tf); only pass here what
        # must change per deploy. --update-env-vars merges, it doesn't replace.
        run: |
          gcloud run deploy APP_NAME-backend \
            --image ${REGISTRY}/backend:${{ github.sha }} \
            --region ${GCP_REGION} \
            --project ${GCP_PROJECT} \
            --quiet

  # ── Frontend ───────────────────────────────────────────────────────────────
  deploy-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.GCP_REGION }}-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontend/Dockerfile # SET
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/frontend:${{ github.sha }}
          # SET: Vite inlines VITE_* at build time → build arg, not runtime env.
          # Value = the backend's custom domain (terraform var.backend_domain).
          build-args: |
            VITE_API_URL=https://api.example.com
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy APP_NAME-frontend \
            --image ${REGISTRY}/frontend:${{ github.sha }} \
            --region ${GCP_REGION} \
            --project ${GCP_PROJECT} \
            --quiet
